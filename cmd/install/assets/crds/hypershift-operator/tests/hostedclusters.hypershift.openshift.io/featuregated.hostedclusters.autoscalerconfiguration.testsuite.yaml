            route: {}
        - service: Konnectivity
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Ignition
          servicePublishingStrategy:
            type: Route
            route: {}
    expectedError: "Unsupported value"

  - name: When daemonSetUtilization has an invalid value it should fail
    initial: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: HostedCluster
      spec:
        autoscaling:
          daemonSetUtilization: Invalid
        dns:
          baseDomain: example.com
        platform:
